<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSApp</title>
  <link rel="stylesheet" href="/css/global.css">
  <script src="/js/index.js" defer></script>
</head>

<body>
  <h1>BSApp</h1>
  <h2>Number Collector</h2>

  <nav>
    <a>Home</a>
    <a href="/query">Query</a>
  </nav>

  <h3>Handle database</h3>
  <div class="input-group">
    <button id="fill-button">Generate 100 random entries</button>
    <button id="clear-button">Clear database</button>
  </div>
  <br>
  <hr>

  <h3>Add named number array object</h3>
  <form id="data-form">
    <input type="text" id="name-input" placeholder="Name">
    <input type="number" id="number-input" placeholder="Add number" step="any">
    <button type="button" id="add-button">Add</button>
    <button type="submit">Send</button>
  </form>
  <div id="number-list">
    <h4>Numbers to add:</h4>
    -
  </div>
  <hr>

  <ul id="object-list"></ul>
</body>

</html>
